name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /home/runner/android-sdk
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_NDK_HOME: /home/runner/android-sdk/ndk/28.2.13676358
      ANDROIDNDK: /home/runner/android-sdk/ndk/28.2.13676358
      ANDROIDSDK: /home/runner/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            patch \
            pkg-config \
            python3-dev \
            unzip \
            wget \
            zip \
            openjdk-17-jdk \
            curl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Install Android command line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          curl -L -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline

          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/android-cmdline/cmdline-tools/* \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK and NDK
        run: |
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Verify toolchain
        run: |
          echo "SDK:"
          ls "$ANDROID_HOME/platforms/android-35/android.jar"

          echo "NDK:"
          ls "$ANDROID_NDK_HOME"

          echo "Clang:"
          ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

      - name: Clean previous Buildozer state
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build debug APK
        env:
          ANDROIDAPI: "35"
          NDKAPI: "24"
        run: |
          buildozer -v android debug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp -v bin/*.apk artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloader-apk
          path: artifacts/*.apk
          if-no-files-found: error
