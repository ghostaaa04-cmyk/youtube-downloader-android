name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev cmake \
            libffi-dev libssl-dev automake gettext wget

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3" buildozer

      - name: Initialize Buildozer
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          buildozer android update || true

      - name: Accept Android licenses and install SDK packages
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_ROOT/tools/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at: $SDKMANAGER"
            find "$HOME/.buildozer/android/platform" -type f -name sdkmanager -print
            exit 1
          fi

          mkdir -p "$SDK_ROOT/licenses"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        run: |
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"

          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/aidl"

          echo "Android SDK is ready"
          ls -la "$SDK_ROOT/build-tools/35.0.0"

      - name: Build debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          buildozer -v android debug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp -v bin/*.apk artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloader-apk
          path: artifacts/*.apk
          if-no-files-found: error
