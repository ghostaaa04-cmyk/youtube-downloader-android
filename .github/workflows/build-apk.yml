name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      BUILDOZER_SDK: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libtool \
            libssl-dev \
            make \
            patch \
            pkg-config \
            python3-dev \
            unzip \
            wget \
            zip \
            openjdk-17-jdk \
            curl

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Initialize Buildozer Android files
        run: |
          buildozer android update || true

      - name: Fix Buildozer Android SDK
        run: |
          SDK_ROOT="$BUILDOZER_SDK"

          mkdir -p "$SDK_ROOT/cmdline-tools"

          curl -L -o /tmp/cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          rm -rf /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline

          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline

          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest"

          mv /tmp/android-cmdline/cmdline-tools/* \
            "$SDK_ROOT/cmdline-tools/latest/"

          mkdir -p "$SDK_ROOT/tools/bin"

          cat > "$SDK_ROOT/tools/bin/sdkmanager" <<'EOF'
          #!/usr/bin/env bash
          exec "$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager" "$@"
          EOF

          chmod +x "$SDK_ROOT/tools/bin/sdkmanager"

      - name: Accept Buildozer SDK licenses
        run: |
          SDK_ROOT="$BUILDOZER_SDK"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

      - name: Install Android packages in Buildozer SDK
        run: |
          SDK_ROOT="$BUILDOZER_SDK"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "build-tools;37.0.0"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" \
            --licenses || true

      - name: Verify Buildozer SDK
        run: |
          SDK_ROOT="$BUILDOZER_SDK"

          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/37.0.0/aidl"
          test -x "$SDK_ROOT/tools/bin/sdkmanager"

          echo "Android SDK ready"
          echo "AIDL:"
          "$SDK_ROOT/build-tools/37.0.0/aidl" --help >/dev/null 2>&1 || true

      - name: Build debug APK
        env:
          ANDROIDAPI: "35"
          NDKAPI: "24"
        run: |
          buildozer -v android debug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp -v bin/*.apk artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: youtube-downloader-apk
          path: artifacts/*.apk
          if-no-files-found: error
